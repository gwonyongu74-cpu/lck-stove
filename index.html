<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LCK 스토브리그</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>LCK STOVE LEAGUE</h1>
    <p>나만의 LCK 스토브리그 선수 명단</p>
</header>

<main>

    <div class="toolbar">
        <button type="button" id="addTeamButton">
            + 팀 추가
        </button>

        <button type="button" id="saveButton" class="save-button">
            저장하기
        </button>
    </div>

    <div class="legend">
        <span class="legend-item">
            <span class="legend-color unlocked"></span>
            잠금 해제: 수정 가능
        </span>

        <span class="legend-item">
            <span class="legend-color locked"></span>
            잠금: 수정 불가
        </span>
    </div>

    <p id="status" role="status" aria-live="polite">
        팀과 선수 이름을 입력하세요.
    </p>

    <div class="table-container">

        <table>
            <thead>
                <tr>
                    <th class="team-column">TEAM</th>
                    <th>TOP</th>
                    <th>JUNGLE</th>
                    <th>MID</th>
                    <th>ADC</th>
                    <th>SUPPORT</th>
                    <th class="delete-column">삭제</th>
                </tr>
            </thead>

            <tbody id="teamTable"></tbody>
        </table>

    </div>

    <p class="notice">
        선수 이름을 입력한 뒤 자물쇠 버튼으로 잠글 수 있습니다.<br>
        잠긴 칸은 초록색으로 표시되며 이름을 수정할 수 없습니다.<br>
        중요한 기록은 백업 파일로도 보관하세요.
    </p>

    <div class="bottom-buttons">

        <button type="button" id="exportButton">
            백업 파일 저장
        </button>

        <label for="importFile" class="import-button">
            백업 파일 불러오기
        </label>

        <input
            type="file"
            id="importFile"
            accept=".json,application/json"
            hidden
        >

    </div>

</main>

<footer>
    LCK STOVE LEAGUE TABLE
</footer>

<script src="script.js"></script>

</body>
</html>
